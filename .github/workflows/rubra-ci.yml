name: Rubra CI

on:
  push:
    branches:
      - rubra
    tags:
      - v*
  pull_request:
    branches:
      - main
      - rubra
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Initialize report
        run: |
          mkdir -p .ci-report
          printf "runner_python=" > .ci-report/report.txt
          python --version >> .ci-report/report.txt 2>&1 || true
          printf "runner_node=" >> .ci-report/report.txt
          node --version >> .ci-report/report.txt 2>&1 || true

      - name: Checkout
        id: diag-checkout
        continue-on-error: true
        uses: actions/checkout@v4

      - name: Python
        id: diag-python
        continue-on-error: true
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Node
        id: diag-node
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run diagnostic validation
        continue-on-error: true
        shell: bash
        run: |
          set +e
          {
            echo "checkout=${{ steps.diag-checkout.outcome }}"
            echo "python_setup=${{ steps.diag-python.outcome }}"
            echo "node_setup=${{ steps.diag-node.outcome }}"
            python --version
            node --version
            python -m pip install --upgrade pip
            echo "pip_upgrade=$?"
            python -m pip install -r requirements-dev.txt
            echo "python_deps=$?"
            python -m compileall -q main.py zenless
            echo "compile=$?"
            python -m ruff check .
            echo "ruff=$?"
            python -m pyright
            echo "pyright=$?"
            python -m pytest -o addopts= -q
            echo "pytest=$?"
            npm --prefix frontend ci
            echo "npm_ci=$?"
            npm --prefix frontend run lint
            echo "eslint=$?"
            npm --prefix frontend run typecheck
            echo "typescript=$?"
            npm --prefix frontend run test
            echo "vitest=$?"
            npm --prefix frontend run build
            echo "frontend_build=$?"
          } >> .ci-report/report.txt 2>&1
          tail -n 400 .ci-report/report.txt

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rubra-Full-CI-Diagnostics
          path: .ci-report/report.txt
          if-no-files-found: error
          retention-days: 7

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Python
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependencies
        id: python-deps
        shell: bash
        run: |
          mkdir -p .ci-bootstrap
          set +e
          python -m pip install --upgrade pip > .ci-bootstrap/python-deps.txt 2>&1
          pip_status=$?
          if [ "$pip_status" -eq 0 ]; then
            python -m pip install -r requirements-dev.txt >> .ci-bootstrap/python-deps.txt 2>&1
            pip_status=$?
          fi
          printf "\ncheckout=%s python=%s node=%s dependencies=%s\n" \
            "${{ steps.checkout.outcome }}" "${{ steps.python.outcome }}" "${{ steps.node.outcome }}" "$pip_status" \
            >> .ci-bootstrap/python-deps.txt
          cat .ci-bootstrap/python-deps.txt
          exit "$pip_status"

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rubra-CI-Bootstrap
          path: .ci-bootstrap/python-deps.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Changed-file diagnostics
        shell: bash
        run: |
          mkdir -p .ci-logs
          set +e
          python -m compileall -q zenless/provider_auth.py zenless/studio_mcp.py zenless/managed_browser.py zenless/webview_host.py > .ci-logs/changed.txt 2>&1
          compile_status=$?
          python -m ruff check zenless/provider_auth.py zenless/studio_mcp.py zenless/managed_browser.py zenless/webview_host.py tests/test_studio_mcp.py tests/test_managed_browser.py >> .ci-logs/changed.txt 2>&1
          ruff_status=$?
          python -m pytest -o addopts= -q tests/test_studio_mcp.py tests/test_managed_browser.py >> .ci-logs/changed.txt 2>&1
          test_status=$?
          printf "\ncompile=%s ruff=%s tests=%s\n" "$compile_status" "$ruff_status" "$test_status" >> .ci-logs/changed.txt
          test "$compile_status" -eq 0 -a "$ruff_status" -eq 0 -a "$test_status" -eq 0

      - name: Upload changed-file diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rubra-CI-Diagnostics
          path: .ci-logs/changed.txt
          if-no-files-found: error
          retention-days: 7

      - name: Python compile
        run: python -m compileall -q main.py zenless

      - name: Ruff
        run: python -m ruff check .

      - name: Pyright
        run: python -m pyright

      - name: Pytest
        run: python -m pytest -o addopts= -q

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: TypeScript
        working-directory: frontend
        run: npm run typecheck

      - name: Vitest
        working-directory: frontend
        run: npm run test

      - name: Chromium browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Desktop browser regressions
        working-directory: frontend
        env:
          RUBRA_TEST_PYTHON: python
        run: npm run test:e2e

      - name: Production frontend
        working-directory: frontend
        env:
          VITE_RUBRA_MOCK: "false"
        run: npm run build

  package:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.base_ref == 'rubra'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Production frontend
        working-directory: frontend
        env:
          VITE_RUBRA_MOCK: "false"
        run: npm run build

      - name: NSIS
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            choco install nsis --version=3.09 --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed." }
          }

      - name: Portable distribution
        shell: pwsh
        run: |
          $nsis = Join-Path ${env:ProgramFiles(x86)} "NSIS\makensis.exe"
          python scripts/build_portable.py --makensis $nsis
          if ($LASTEXITCODE -ne 0) { throw "Portable packaging failed." }

      - name: Package verification
        run: python scripts/verify_portable.py dist/Rubra

      - name: WebView2 runtime
        run: python -c "from pathlib import Path; from zenless.provisioning import ensure_webview2; ensure_webview2(Path.cwd(), Path('build/webview-smoke'))"

      - name: Portable Windows smoke
        run: python scripts/smoke_portable.py dist/Rubra

      - name: WebView2 round trip
        run: python -m pytest -o addopts= -q tests/test_managed_browser.py::WebView2BrowserIntegrationTests

      - name: Upload Rubra
        uses: actions/upload-artifact@v4
        with:
          name: Rubra-Windows
          path: |
            dist/Rubra-Setup.exe
            dist/Rubra-Windows.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: Rubra-Windows
          path: release-assets

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python -c 'from zenless import __version__; print(__version__)')
          test "$RELEASE_TAG" = "v$version"
          cd release-assets
          sha256sum --check SHA256SUMS.txt
          gh release create "$RELEASE_TAG" Rubra-Setup.exe Rubra-Windows.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "Rubra $version" \
            --notes-file ../RELEASE_NOTES.md --prerelease
